name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Frontend CI: Lint, Typecheck, and Build
  # ==========================================
  frontend-ci:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Build Next.js Production App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost/api

  # ==========================================
  # Backend CI: Checks, Migrations, and Tests
  # ==========================================
  backend-ci:
    name: Backend CI (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: python manage.py check
        env:
          SECRET_KEY: ci-secret-key-for-automated-checks
          DEBUG: 'False'

      - name: Verify No Missing Migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-secret-key-for-automated-checks
          DEBUG: 'False'

      - name: Run Django Tests
        run: python manage.py test apps
        env:
          SECRET_KEY: ci-secret-key-for-automated-checks
          DEBUG: 'True'
          STRIPE_SECRET_KEY: sk_test_demo

  # ==========================================
  # Docker Build & Push to Docker Hub
  # ==========================================
  docker-build-push:
    name: Build & Push Docker Images
    needs: [ frontend-ci, backend-ci ]
    runs-on: ubuntu-latest
    # Build & push on pushes to main or manual dispatch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Credentials Availability
        id: docker_auth_check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::Docker Hub credentials (DOCKERHUB_USERNAME and DOCKERHUB_TOKEN) are not set. Skipping push to Docker Hub."
          fi

      - name: Log in to Docker Hub
        if: steps.docker_auth_check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Backend Image ---
      - name: Extract Docker metadata for Backend
        id: meta_backend
        if: steps.docker_auth_check.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ausie-supplement-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ steps.docker_auth_check.outputs.enabled == 'true' }}
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Frontend Image ---
      - name: Extract Docker metadata for Frontend
        id: meta_frontend
        if: steps.docker_auth_check.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ausie-supplement-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ steps.docker_auth_check.outputs.enabled == 'true' }}
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
