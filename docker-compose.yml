services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: aussie_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aussie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aussie_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aussie_supplements_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aussie_user} -d ${POSTGRES_DB:-aussie_supplements_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aussie_network

  # 2. Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: aussie_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aussie_network

  # 3. Django REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aussie_backend
    restart: unless-stopped
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-production-secret-key-australian-supplements-2026}
      - DATABASE_URL=postgres://${POSTGRES_USER:-aussie_user}:${POSTGRES_PASSWORD:-aussie_pass}@db:5432/${POSTGRES_DB:-aussie_supplements_db}
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-wpjinadhi@gmail.com}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aussie_network

  # 4. Next.js App Router Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api}
        - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER:-94775696254}
    container_name: aussie_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api}
      - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER:-94775696254}
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    depends_on:
      - backend
    networks:
      - aussie_network

  # 5. Nginx Unified Gateway / Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: aussie_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/backend/staticfiles:ro
      - media_data:/app/backend/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      - aussie_network

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:

networks:
  aussie_network:
    driver: bridge
